<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="p-3 mb-2 bg-dark text-white">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
       
        <div style="text-align: right;" class = "row">
            <div class="col-10" style="text-align: left; padding-left: 10px; font-size: large;">Google</div>
            <div class="col-1"><a href="index.html">Search</a></div>
            <div class="col-1"><a href="image.html">Images</a></div>
        </div>
     <hr>
        <div>
            <form class="row g-3 align-items-center" action="https://www.google.com/search">
                <div style="padding: 10px; padding-left: 75px;"><h3>Advanced Search</h3></div>
                <div style="padding: 10px; padding-left: 75px;"> <h5>Find pages with</h5></div>
               
                <div class="row" style="padding-bottom: 20px;">
                    <label class="col-2" style="padding-left: 75px;">All of these words:</label>
                    <input type="text" name="as_q" class="p-2 mb-1 bg-dark text-white col-3">
                </div>
                
                <div class="row" style="padding-bottom: 20px;">
                    <label class="col-2" style="padding-left: 75px;">Exact phrase or word:</label>
                    <input type="text" name="as_epq" class="p-2 mb-1 bg-dark text-white col-3">
                </div>
                
                <div class="row" style="padding-bottom: 20px;">
                    <label class="col-2" style="padding-left: 75px;">None of these words:</label>
                    <input type="text" name="as_eq" class="p-1 mb-1 bg-dark text-white col-3">
                </div>
                
                <div class="row" style="padding-bottom: 20px;">
                    <label class="col-2" style="padding-left: 75px;">Site or domain:</label>
                    <input type="text" name="as_sitesearch" class="p-2 mb-1 bg-dark text-white col-3">
                </div>
                
                <div class="row">
                    <div class="col-4"></div>
                    <input class="col-1"style="background-color: #a8c7fa; margin: 0; border-radius: 9999px;" type="submit" value="Google Search">
                </div>
                
        </form>
        </div>
        
    </body>
</html>
